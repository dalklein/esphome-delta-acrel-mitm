  - platform: mqtt_subscribe
    id: delta_gt_meter_adjust
    name: "Delta Meter Adjustment"
    topic: "cmnd/delta-gt-meter/adjust_pwr"
    # update_interval: .5s      not a valid parameter
    # default is 60s, which is far too slow to notice a new command

  - platform: mqtt_subscribe
    id: raw_delta_ctrl_mode
    name: "RawDelta Control Mode"
    topic: "cmnd/delta-gt-meter/ctrl_mode"
# 0 - normal meter operation (inverter self-consumption), 1 - disable meter, charge battery from direct PV only

  - platform: mqtt_subscribe
    id: raw_delta_ctrl_gain
    name: "RawDelta Control Gain"
    topic: "cmnd/delta-gt-meter/ctrl_gain"
# 1 - normal gain

  - platform: template
    id: delta_ctrl_mode
    name: "Delta Control Mode"
    lambda: |-
      // std::isnan, NOT `== NAN`: every comparison with NaN is false, so `== NAN` would
      // never fire and this would return NaN. Downstream that is not a harmless NaN --
      // the `delta_ctrl_mode == 0` gate below would be false too, adjusted_meter_power
      // would never publish, and the server would serve its zero-initialised last value.
      if (std::isnan(id(raw_delta_ctrl_mode).state)) {
        return 0;  // no ctrl_mode published yet -> normal pass-through-with-offset
      }
      return id(raw_delta_ctrl_mode).state;

  - platform: template
    id: delta_ctrl_gain
    name: "Delta Control Gain"
    lambda: |-
      if (std::isnan(id(raw_delta_ctrl_gain).state)) {
        return 1.0;  // no ctrl_gain published yet -> unity gain
      }
      return id(raw_delta_ctrl_gain).state;

  - platform: template
    id: processed_delta_gt_meter_adjust
    name: "Processed Delta Meter Adjustment"
    lambda: |-
      if (std::isnan(id(delta_gt_meter_adjust).state)) {
        return 0;  // no offset published yet -> serve the meter unmodified
      }
      return id(delta_gt_meter_adjust).state;
    update_interval: .5s   # mqtt_subscribe only re-evaluates every 60s by default, which would
          # cap how fast the offset can change. This re-reads it twice a second so a new
          # command reaches the served value promptly.

  - platform: template
    id: processed_delta_gt_meter_adjust_half
    name: "Processed Delta Meter Adjustment Half"
    lambda: |-
      float adjustment = id(processed_delta_gt_meter_adjust).state;
      return std::isnan(adjustment) ? 0 : adjustment / 2;
    update_interval: .5s

