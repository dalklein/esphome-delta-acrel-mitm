  - platform: modbus_controller
    modbus_controller_id: meter_client
    id: meter_total_real_power
    name: "Meter Total Real Power"
    # internal: true
    address: 40018
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "W"  
    device_class: power
    state_class: measurement
    # 200 ms EMA. alpha = 1 - exp(-dt/tau) = 1 - exp(-0.3/0.2) = 0.78 at the 0.3 s poll.
    # Filters the MEASUREMENT only -- the MQTT offset is added after this in the on_value
    # lambda, so a command still acts immediately. Purpose is NOT noise removal: the meter signal
    # was measured as coherent, not noisy (lag-1 autocorrelation of its differences is +0.50;
    # white noise would be -0.5). It is to replace the zero-order-hold STAIRCASE with a ramp, so
    # the Delta's integrator stops seeing a discontinuity at every sample.
    filters:
      - exponential_moving_average:
          alpha: 0.78
          send_every: 1
    on_value:
      then:
        - lambda: |-
            if (id(delta_ctrl_mode).state == 0) { 
              int16_t power_value = (id(meter_total_real_power).state) * id(delta_ctrl_gain).state + id(processed_delta_gt_meter_adjust).state;
              id(adjusted_meter_power).publish_state(power_value);  // Update the adjusted meter power sensor
            }
        # - mqtt.publish:
        #     topic: "delta/inv/sensor/meter_total_real_power/state"
        #     payload: !lambda |-
        #       int16_t mtrp_value = id(meter_total_real_power).state;
        #       return String(mtrp_value).c_str();

  - platform: modbus_controller
    modbus_controller_id: meter_client
    id: meter_power_ph_a
    internal: true
    address: 40019
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    # 200 ms EMA. alpha = 1 - exp(-dt/tau) = 1 - exp(-0.3/0.2) = 0.78 at the 0.3 s poll.
    # Filters the MEASUREMENT only -- the MQTT offset is added after this in the on_value
    # lambda, so a command still acts immediately. Purpose is NOT noise removal: the meter signal
    # was measured as coherent, not noisy (lag-1 autocorrelation of its differences is +0.50;
    # white noise would be -0.5). It is to replace the zero-order-hold STAIRCASE with a ramp, so
    # the Delta's integrator stops seeing a discontinuity at every sample.
    filters:
      - exponential_moving_average:
          alpha: 0.78
          send_every: 1

