uart:
  - id: moduart_client     # cross rx/tx lines from ESP to ttl-rs485
    tx_pin: GPIO16   # connected to tx pin on ttl-rs485, labelled rx pin on ESP
    rx_pin: GPIO17
    baud_rate: 9600
    # 🔑 Put rx_full_threshold ABOVE the longest expected reply, so each response is
    # delivered as ONE chunk and never splits. The longest here is the 23-register read
    # at 51 bytes; 120 clears it. A split reply is what produces modbus's
    # "not enough data for value" -- the deadline lands on an inter-chunk boundary.
    #
    # ⚠️ Shortening rx_timeout to chase this makes it WORSE, not better: a shorter idle
    # timeout delivers MORE, SMALLER chunks, i.e. more boundaries to miss. Measured here,
    # rx_timeout: 1 multiplied the failure rate by 17x. The threshold is the fix; the
    # timeout only sets how long after the last byte the single chunk is released
    # (10 char-times = 10.4 ms at 9600, negligible against the 300 ms poll) and it
    # tolerates a device that pauses mid-response.
    # 🔴 NEVER rx_timeout: 0 -- that disables the idle interrupt entirely and would strand
    # every sub-threshold delivery permanently.
    rx_full_threshold: 120
    rx_timeout: 10
    stop_bits: 1
    data_bits: 8
    parity: NONE

  - id: moduart_server  # cross rx/tx lines from ESP to ttl-rs485
    tx_pin: GPIO18   # connected to tx pin on ttl-rs485, labelled rx pin on ESP
    rx_pin: GPIO19
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: NONE
  
modbus:
  - uart_id: moduart_client
    id: mod_client
    # 2026.8: command_throttle on modbus_controller is inert; spacing moved here.
    # NOTE it is not the same measurement: command_throttle was send-to-send,
    # turnaround_time is end-of-reply to next request (~one transaction slower).
    # Default 600ms would roughly halve the bus-1 poll rate -- hold 100ms.
    turnaround_time: 100ms
    # Default is 2000ms. When a reply IS dropped the hub is tx_blocked() for the whole wait
    # -- measured as 2.011 s of fully blocked bus-1 client, ~1.3% dead time, feeding a control
    # loop that is a pure integrator. Bus-1 request->reply measures 11-20 ms, so 150 ms is
    # ~8x margin and cuts the cost of each dropped reply by 13x.
    send_wait_time: 150ms
  - uart_id: moduart_server
    id: mod_server
    role: server
#    disable_crc: true

modbus_controller:
  # - id: batt_mute_client   # parse responses from battery, but don't send requests
  #   address: 15  # address of the LG battery
  #   modbus_id: mod_server
  #   command_throttle: 100ms
  #   setup_priority: -10
  #   update_interval: 1s
  # - id: batt_mute_server   # detect request from inverter for battery, don't respond, tell batt_mute_client request was received
  #   address: 15  # address of the LG battery
  #   modbus_id: mod_server
  #   command_throttle: 100ms
  #   setup_priority: -10

  # ⚠️ Per-sensor `skip_updates` is INERT from 2026.9.0 -- every range is polled each
  # update_interval. The replacement is one controller per cadence, same address, same hub,
  # which is why there are three below. Cadences are matched to what the DELTA actually
  # asks for on bus 2, measured over a full day:
  #     40018 x5  807,262 req/day = every 107 ms   -> FAST
  #     40001 x4   30,216         = every 2.9 s    -> fed by MED voltages (slow-moving divisors)
  #     40008/40016/40033/4004x    ~1,585          = every 54.5 s -> MED is ample
  #     40088 x5    5,274         = every 16.4 s   -> SLOW; energy counters, staleness immaterial
  #     40071 x4      196         = every 7.3 min  -> SLOW  (this is the 51-byte 23-register read)
  #     40078/40086/4010x/4011x/40120/40188  ~12   = every ~2 h -> SLOW
  # Net effect: LESS bus-1 traffic than skip_updates produced (~2.2 vs ~3.4 transactions/s), and the
  # 51-byte worst-case frame moves off the control path onto the 60 s tier.
  - id: meter_client            # FAST - feeds 40018-40022, the block the Delta reads at 107 ms
    address: 2  # address of the meter - Acrel AGF-AE-D
    modbus_id: mod_client
    setup_priority: -210
    # The Delta re-reads the served W block every ~113 ms (measured over 578,346 intervals,
    # and constant regardless of whether the meter answers), so this rate sets how stale the
    # value it reads can be. Budget: one 40018 transaction costs 44 ms of bus time (8.3 request
    # + 20.0 Acrel latency + 15.6 reply) and the Acrel's latency is p99.99 = 32.8 ms, so 0.3 s
    # is ~15% duty with large margin. The cycle is max(300, 44+100) = 300 ms, so
    # update_interval stays the binding constraint and turnaround_time can stay at 100 ms.
    # ⚠️ A 0.3 s client rate once produced "duplicate modbus command" warnings on ESPHome
    # 2025.2.0. 2026.9.0 reworked the client queue as a per-frame state machine (#17922), so
    # it may no longer apply -- but watch the logs for it if you run this faster.
    update_interval: .3s
  - id: meter_client_med        # MED - voltages feed the computed current regs (Delta: 2.9 s); Hz, PF
    address: 2
    modbus_id: mod_client
    setup_priority: -210
    update_interval: 5s
  - id: meter_client_slow       # SLOW - energy accumulators, barcode, version
    address: 2
    modbus_id: mod_client
    setup_priority: -210
    update_interval: 60s

modbus_server:
  - id: meter_server
    modbus_id: mod_server
    address: 2          # the Delta Ex-TL-US expects the meter at id 2
    registers:
      - address: 40001   # Fixed integer value Sunspec length, inverter checking for meter type?
        value_type: S_WORD
        read_lambda: |-
          static float _last = 0.0f;
          const float _v = ([&]() -> float {
            if (id(delta_ctrl_mode).state == 1) { return 0; }
            return 105;
          })();
          if (std::isnan(_v) || std::isinf(_v)) return static_cast<int16_t>(_last);  // hold last good, never decline
          _last = _v;
          return static_cast<int16_t>(_v);
      - address: 40002   # est current from adj power and voltage, both A & V are .1 scaling
        value_type: S_WORD
        read_lambda: |-
          static float _last = 0.0f;
          const float _v = ([&]() -> float {
            if (id(delta_ctrl_mode).state == 1) { return 0; }
            return (static_cast<float>(id(adjusted_meter_power).state) / id(meter_LL_Voltage).state);
          })();
          if (std::isnan(_v) || std::isinf(_v)) return static_cast<int16_t>(_last);  // hold last good, never decline
