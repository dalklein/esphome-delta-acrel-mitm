# ============================================================================
# Delta E-series inverter <-> Acrel AGF-AE-D meter, man-in-the-middle on one ESP32.
#
# 🔴 THIS FIRMWARE TRANSMITS AND CHANGES INVERTER BEHAVIOUR. Read the README
#    before flashing it. It sits IN SERIES with the revenue meter: it is the only
#    thing the inverter can see of the grid, and what it reports steers charge and
#    discharge. Getting it wrong on a grid-tied system is not a cosmetic failure.
#
#   ESP32-WROOM-32, board esp32dev, framework arduino
#
#   GPIO16 TX, GPIO17 RX   bus 1, 9600 8N1 -- CLIENT
#                   This board is master here and polls the real Acrel meter at
#                   address 2.
#   GPIO18 TX, GPIO19 RX   bus 2, 9600 8N1 -- SERVER
#                   The inverter's RGM bus. This board answers the Delta AS the
#                   meter, at address 2. The Delta is master.
#
#   ⚠️ RX/TX cross between the ESP and each RS485-TTL module. The pin labelled TX
#      on the module goes to the pin labelled RX on the devkit silkscreen. Follow
#      the comments at each uart, not the silkscreen.
#
# WHAT IT DOES
#   Reads the real meter on bus 1, applies an offset, and serves the result to the
#   Delta on bus 2. The offset is what gives you control: the inverter runs a
#   self-consumption loop against the meter reading, so biasing that reading makes
#   it charge or discharge. The offset arrives over MQTT.
#
# CONTROL TOPICS (subscribe side)
#     cmnd/delta-gt-meter/adjust_pwr   watts to add to the served reading
#     cmnd/delta-gt-meter/ctrl_mode    0 = pass through with offset, 1 = serve zeros
#     cmnd/delta-gt-meter/ctrl_gain    scale factor, 1 = normal
#
#   ⚠️ ctrl_mode 1 does NOT stop the inverter. Serving zeros makes it FREEZE at
#      whatever it was doing, because its control loop has no error to act on.
#      It is a freeze, not a stop.
#
# Telemetry is published under the delta/inv/ prefix.
#
# ESPHOME VERSION: needs 2026.9.0 or newer, and is stock -- no fork, no patch.
#   (2026.8 is NOT enough: `reuse_previous_range` does not exist there, and per-sensor
#   `skip_updates` is still live rather than inert, so the three-controller split below
#   would poll differently than intended.)
#   `modbus_controller`'s `server_registers:` was removed upstream; the server side
#   is the dedicated `modbus_server:` component, which clamps each response to the
#   requested register count. Three things that matter if you port an older config:
#     * allow_partial_read: true on every S_DWORD. The default is false, which turns
#       a read that clips a 32-bit register into an ILLEGAL_DATA_ADDRESS exception --
#       a response the Delta has never been shown.
#     * every read_lambda returns optional<T> and declines on NaN/Inf. modbus_server
#       does NOT handle NaN for you; serving it means undefined bytes on the wire.
#     * `command_throttle` is inert; client spacing is `turnaround_time` (default
#       600 ms, set to 100 ms here).
#
# Inspired by PaulSturbo's solis-ct-meter.yaml, which showed an ESPHome modbus server
# could stand in for a meter. MIT licensed -- see LICENSE and README.md.
# ============================================================================
esphome:
  name: delta-acrel-mitm
  friendly_name: Delta Meter
  on_boot:
    then:
      - lambda: App.set_loop_interval(0);

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: WARN   # Keep at WARN, not ERROR: modbus_server logs a declined read at WARN
                #  and an exception reply at DEBUG, so ERROR hides the two things you
                #  most want to see if the server side misbehaves.
#  level: VERBOSE
  baud_rate: 0
  
debug:
  update_interval: 5s  

mqtt:
  broker: !secret mqtt_broker_ip
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: "delta/inv"
  on_disconnect:
    - logger.log: "MQTT broker not available, continuing execution."

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
  - ssid: !secret wifi_ssid_g
    password: !secret wifi_password
  - ssid: !secret wifi_ssid
    password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Delta Meter Fallback Hotspot"
    password: !secret ap_password

captive_portal:

